# Default jj workspace tab config
# Stored in ~/.warp/default_tab_configs/ — you can customize this file!
# Any customizations will apply for any new workspaces created in jj repositories from the
# "Worktree in" submenu.
#
# jj repositories get a jj workspace instead of a git worktree, created under
# ~/.warp/worktrees/<repo-name>/<workspace-name>. The new workspace's working-copy change starts
# on the same parent as the repository's current working-copy change.

name = "jj workspace"

[[panes]]
id = "main"
type = "terminal"
directory = "{{repo}}"
commands = [
  "jj workspace add \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\" --name {{autogenerated_branch_name}}",
  "cd \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\"",
]

[params.repo]
type = "repo"
description = "Repository to create the workspace in"
