on:
  pull_request:
    branches:
      - 'master'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - 'master'
  workflow_dispatch:
  workflow_call:

name: Jiffy CI

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  WORKSPACE_TEST_ARGS: --workspace --locked
  # Include only as much debug info as is necessary to see backtraces in test failures. Set via the
  # profile rather than RUSTFLAGS so the linker flags in .cargo/config.toml still apply.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

concurrency:
  # Cancel any outstanding CI workflow runs against the same PR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Compute workflow parameters
    timeout-minutes: 3
    runs-on: ubuntu-latest
    # Don't automatically run CI for draft PRs.
    if: github.event.pull_request.draft != true
    outputs:
      affects-database-schema: ${{ github.event_name != 'pull_request' || steps.filter.outputs.affects-database-schema }}
      needs-build: ${{ github.event_name != 'pull_request' || steps.build_filter.outputs.needs-build }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check changed files
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            affects-database-schema:
              - 'crates/persistence/src/schema.rs'
              - 'crates/persistence/migrations/**'

      - name: Check for build inputs
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: build_filter
        with:
          predicate-quantifier: every
          filters: |
            needs-build:
              - '**'
              # Only human-readable files in known documentation locations may skip builds.
              - '!AGENTS.md'
              - '!README.md'
              - '!.github/**/*.md'
              - '!specs/**'

  tests:
    name: Run Linux tests
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: params
    if: ${{ needs.params.outputs.needs-build == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_test_deps: true

      - name: Install cargo nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: Run unit tests
        run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }}
        env:
          # Unit tests may spawn a shell but shouldn't care which one; zsh has the shortest
          # bootstrap times and tends to be the most reliable.
          WARP_SHELL_PATH: /usr/bin/zsh

      # nextest doesn't support doc tests: https://github.com/nextest-rs/nextest/issues/16
      - name: Run doc tests
        if: success() || failure()
        run: cargo test ${{ env.WORKSPACE_TEST_ARGS }} --doc

  database-migration:
    name: Database Migration (Diesel)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: params
    if: ${{ needs.params.outputs.affects-database-schema == 'true' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cargo-binstall
        run: ./script/install_cargo_binstall

      - name: Install diesel_cli
        run: |
          cargo binstall diesel_cli

      - name: Run all migrations on empty file
        run: |
          cp crates/persistence/src/schema.rs old-schema.rs
          diesel migration run --database-url="test.sqlite" --migration-dir="crates/persistence/migrations"

      - name: Regenerate schema and check if it is consistent with the schema at HEAD
        shell: bash
        run: |
          diff -u old-schema.rs <(diesel print-schema --database-url="test.sqlite")

  lints:
    name: Formatting + Clippy
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: params
    if: ${{ needs.params.outputs.needs-build == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false

      - name: Ensure cargo.lock is up-to-date
        run:
          cargo metadata --locked --format-version=1 > /dev/null || (echo "::error::Cargo.lock is out-of-date with Cargo.toml. Run 'cargo check' to update." && exit 1)

      - name: Run ./script/format
        shell: bash
        run: ./script/format --check

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets --tests -- -D warnings

      - name: Verify the GUI binary builds
        run: cargo check --locked -p jiffy --bin jiffy --features gui

  general-lint:
    name: Miscellaneous checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: params
    if: ${{ needs.params.outputs.needs-build == 'true' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Only cache runs on the master branch (caches on feature branches are not reusable).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-binstall
        run: ./script/install_cargo_binstall

      - name: Check licenses for dependencies
        run: |
          cargo binstall --force -y cargo-deny
          # Make sure all of our dependencies use licenses that are compatible with our usage.
          cargo deny -L error check licenses

      - name: Check deny.toml / about.toml license sync
        run: ./script/check_license_config_sync

      - name: Run WGSL formatter
        run: |
          # note: this matches the version used in script/install_cargo_test_deps...
          # if changing here, probably a good idea to change there too to keep dev tools on local ~= CI
          cargo install --git https://github.com/wgsl-analyzer/wgsl-analyzer --tag "2025-06-28" wgslfmt && \
          find . -name "*.wgsl" -exec wgslfmt --check {} +

      - name: Install ShellCheck
        uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1
        with:
          apt: shellcheck

      - name: Run ShellCheck
        run: ./script/lint_shellcheck --ci

      - name: Check for incorrectly named test files
        run: |
          # Test files should end in _tests.rs, not _test.rs.
          bad_files=$(find . -name '*_test.rs')
          if [ -n "$bad_files" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::Test file should be named ${f/_test.rs/_tests.rs} (use _tests.rs, not _test.rs)"
            done <<< "$bad_files"
            exit 1
          fi

      - name: Check for inline Rust test modules
        run: ./script/check_no_inline_test_modules

  # Collects the results of the parallel CI jobs so that a single required check covers all of them.
  ci-result:
    name: Check CI results
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - params
      - database-migration
      - tests
      - lints
      - general-lint
    steps:
      - name: Check CI results
        run: |
          needs_build="${{ needs.params.outputs.needs-build }}"

          echo '${{ toJSON(needs) }}' | jq -r --arg needs_build "$needs_build" '
            to_entries |
            map(select(.key != "database-migration")) |
            .[] |
            (if .key == "params" or $needs_build == "true" then "success" else "skipped" end) as $expected |
            if .value.result != $expected then
              "::error::Job \(.key) had unexpected status \(.value.result) (expected: \($expected))"
            else
              empty
            end
          ' | {
            if read -r error; then
              echo "$error"
              exit 1
            fi
          }

          affects_schema="${{ needs.params.outputs.affects-database-schema }}"
          migration_result="${{ needs.database-migration.result }}"

          if [[ "$affects_schema" == "true" && "$migration_result" != "success" ]]; then
            echo "::error::Database migration job failed or was skipped when it should have run (status: $migration_result)"
            exit 1
          elif [[ "$affects_schema" != "true" && "$migration_result" != "skipped" ]]; then
            echo "::error::Database migration job should have been skipped but wasn't (status: $migration_result)"
            exit 1
          fi

          echo "All jobs completed successfully!"
